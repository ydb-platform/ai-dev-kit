description: Java audit · unbounded QueryStream and wrong cancellation handle (RULE-JV-07)

vars:
  user_prompt: |
    Review this native YDB Java SDK helper. `remainingBudget` is derived from
    the incoming request deadline, and `requestCancelled` completes when the
    caller disconnects.

    ```java
    CompletableFuture<Result<QueryInfo>> loadUsers(
            QuerySession session,
            Duration remainingBudget,
            CompletableFuture<Void> requestCancelled) {
        QueryStream stream = session.createQuery(
                "SELECT id, name FROM users",
                TxMode.SNAPSHOT_RO,
                Params.empty(),
                ExecuteQuerySettings.newBuilder().build());

        CompletableFuture<Result<QueryInfo>> result = stream.execute(this::onPart);
        requestCancelled.thenRun(() -> result.cancel(true));
        return result;
    }
    ```

assert:
  - type: llm-rubric
    value: |
      The response should:
      - Cite `RULE-JV-07` by ID.
      - Identify that `ExecuteQuerySettings` has no caller-derived
        `.withRequestTimeout(remainingBudget)` and that cancelling only the
        returned `CompletableFuture` is not the Query Service stream
        cancellation API.
      - Recommend setting the request timeout from the caller's remaining
        budget and invoking `QueryStream.cancel()` when the caller cancels.
      - Explain that one caller budget must cover acquisition/retries, RPC,
        and stream consumption instead of resetting a full timeout per retry.
      - State that stream cancellation is best-effort: the server is informed
        but may not stop processing, so cancellation is not proof of rollback.

      Full fail if the response claims `CompletableFuture.cancel(true)` alone
      is the documented YDB stream cancellation mechanism.
