description: Table CLI · Explain a complex query before execution

vars:
  user_prompt: |
    The schema is known. Execute `query.sql` against profile `prod`; it has a
    multi-statement query with a join and window function. If there is a YQL
    error, fix it and retry.

assert:
  - type: llm-rubric
    value: |
      The response should:
      - Verify `ydb sql` syntax through local help first.
      - Run the query file with `ydb -p prod sql --explain -f query.sql`
        before any execution attempt.
      - Iterate on parser or semantic errors with `--explain`, not by running
        broken queries repeatedly.
      - Execute with `ydb -p prod sql -f query.sql` only after validation
        succeeds.
      - Not substitute `--explain-analyze` for validation and not add `-y`.
