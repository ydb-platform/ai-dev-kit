description: Routing · YDB CLI scheme inspection → ydb-core

vars:
  user_prompt: |
    Use YDB CLI to list the objects under `/Root/app` and describe the
    `orders` table. I am already connected with profile `prod`.

assert:
  - type: regex
    value: \bydb-core\b
  - type: not-regex
    value: \bydb-table\b
  - type: not-regex
    value: \bnone\b
