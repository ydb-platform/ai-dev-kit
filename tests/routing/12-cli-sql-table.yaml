description: Routing · ydb sql query execution → ydb-table

vars:
  user_prompt: |
    Build a parameterized `ydb sql` command that selects one item by its
    Uint64 primary key, validate it with `--explain`, and then run it.

assert:
  - type: regex
    value: \bydb-table\b
  - type: not-regex
    value: \bydb-core\b
  - type: not-regex
    value: \bnone\b
