description: Routing · DECLARE syntax → ydb-table

vars:
  user_prompt: |
    In YQL, should I write `DECLARE $id AS "Uint64";`, or can I omit
    the declaration when the SDK sends a typed parameter?

assert:
  - type: regex
    value: \bydb-table\b
  - type: not-regex
    value: \bydb-core\b
  - type: not-regex
    value: \bnone\b
