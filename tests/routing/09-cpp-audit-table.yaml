description: Routing · C++ RetryQuerySync audit routes to ydb-table

vars:
  user_prompt: |
    Please audit this C++ code that uses `ydb-cpp-sdk` and
    `RetryQuerySync`. Are there YDB anti-patterns?

    ```cpp
    client.RetryQuerySync([](NYdb::NQuery::TSession session) {
        return session.ExecuteQuery("SELECT 1",
            NYdb::NQuery::TTxControl::BeginTx(
                NYdb::NQuery::TTxSettings::OnlineRO()).CommitTx()
        ).GetValueSync();
    });
    ```

assert:
  - type: llm-rubric
    value: |
      The response should:
      - Treat this as ydb-table scope (C++ application code against
        YDB tables), not ydb-core-only onboarding.
      - Load or reference C++ SDK guidance (`RULE-CPP-*` or
        `references/embed/cpp.md` patterns) rather than saying C++
        SDK guidance is unavailable.
      - Mention `RetryQuerySync` / idempotency or parameterization
        where relevant to the snippet.
      - Not invent YQL or SDK APIs absent from the loaded skills.

      Full fail if the response says C++ SDK-specific guidance is not
      shipped in this skill.
