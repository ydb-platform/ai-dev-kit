description: Routing · SDK deadline/cancellation audit → ydb-table

vars:
  user_prompt: |
    Audit this YDB Go SDK handler. It receives `requestCtx`, but calls
    `db.Query().Do(context.Background(), ...)`. Make sure cancellation and the
    request deadline reach session acquisition, retries, and the query RPC.

assert:
  - type: regex
    value: \bydb-table\b
  - type: not-regex
    value: \bydb-core\b
  - type: not-regex
    value: \bnone\b
